# 一鍵部署到 Render（https://render.com，免費方案即可）
# 使用方式：把專案推到 GitHub，Render 上 New → Blueprint → 選 repo
services:
  - type: web
    name: line-baseball-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
